<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose container</title>
  <style>
    body { font: 14px sans-serif; padding: 16px; }
    #cc-dest { color: #555; word-break: break-all; }
    #cc-options { list-style: none; padding: 0; }
    #cc-options li { padding: 6px 8px; cursor: pointer; border-radius: 4px; }
    #cc-options li:hover, #cc-options li:focus { background: #eef; outline: none; }
    #cc-status { color: #555; }
  </style>
</head>
<body>
  <p id="cc-dest"></p>
  <ul id="cc-options"></ul>
  <p id="cc-status" hidden></p>
  <script src="choice.js"></script>
</body>
</html>
