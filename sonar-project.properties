# SonarCloud (SonarQube Cloud) analysis, run from .github/workflows/sonarcloud.yaml.
#
# Automatic Analysis must stay OFF in the project's settings. It cannot import coverage,
# and with it on every CI scan fails outright ("You are running CI analysis while
# Automatic Analysis is enabled") rather than merely duplicating work.

sonar.projectKey=ArloL_configurable-containers
sonar.organization=arlol
sonar.sourceEncoding=UTF-8

# Sources and tests must not overlap — a file declared as both is a hard scan error.
# `harness/` and `extensions/probe/` are test infrastructure: the Selenium layer and the
# observation extension the e2e cases read the browser through.
sonar.sources=src,scripts,extensions/cc
sonar.tests=test,harness,extensions/probe

# esbuild output, gitignored and rebuilt at test launch. Present in a checkout only if a
# build ran first; analysing a bundle of src/ reports every issue in src/ twice.
sonar.exclusions=extensions/cc/background.js,extensions/cc/choice.js,extensions/cc/options.js

sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info

# A file the lcov report never mentions is read as 0% covered, so anything outside the
# coverage run's scope has to be named here or it drags the project measure down while
# saying nothing true. `npm run test:coverage` measures `src/**` only, minus the three
# files no deterministic level can reach (vitest.coverage.config.ts says why).
sonar.coverage.exclusions=scripts/**,harness/**,extensions/**,src/extension/background.ts,src/extension/choice.ts,src/extension/options.ts

# Findings that are wrong about this code. Recorded here rather than resolved in the web
# UI so the reasoning is reviewable in the diff that adds it, and survives the project
# being recreated. Everything not listed gets fixed.

sonar.issue.ignore.multicriteria=sortOrder,binPath,parseProbe

# S2871 wants `String.localeCompare` behind every `.sort()`. Both sorts here are sorting
# for MACHINES, and locale-aware order is the one thing they must not have.
# `package.ts` sorts the xpi's entries, and a byte-identical rebuild on another machine is
# the whole promise the release verifier checks — a collation that varies by locale breaks
# it. `flake-check.ts` sorts case names for a report whose value is being comparable
# across runs and across the machines a nightly runs on.
sonar.issue.ignore.multicriteria.sortOrder.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.sortOrder.resourceKey=scripts/**/*

# S4036 asks that `git`, `gh`, `npm`, `npx` and `curl` be invoked by absolute path so a
# writable PATH entry cannot shadow them. These run in a developer's own shell and in CI,
# from a checkout that already gets to run arbitrary npm scripts and hooks — an attacker
# who can write to PATH here has already won by a shorter route. Absolute paths would also
# have to be per-platform, which is what `mise`, nvm and Homebrew exist to stop anyone
# hardcoding.
sonar.issue.ignore.multicriteria.binPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.binPath.resourceKey=scripts/**/*

# S5332 reads `"http://" + hostish + "/"` as a plaintext request. Nothing is fetched: it is
# how `bareHost` asks the URL parser whether a string is a hostname and nothing else, and
# the scheme is the one part of it that is never used. The comment above the line already
# says the trailing "/" is the empty path being asked about.
sonar.issue.ignore.multicriteria.parseProbe.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.parseProbe.resourceKey=src/matcher/matcher.ts
