# SonarCloud (SonarQube Cloud) analysis, run from .github/workflows/sonarcloud.yaml.
#
# Automatic Analysis must stay OFF in the project's settings. It cannot import coverage,
# and with it on every CI scan fails outright ("You are running CI analysis while
# Automatic Analysis is enabled") rather than merely duplicating work.

sonar.projectKey=ArloL_configurable-containers
sonar.organization=arlol
sonar.sourceEncoding=UTF-8

# Sources and tests must not overlap — a file declared as both is a hard scan error.
# `harness/` and `extensions/probe/` are test infrastructure: the Selenium layer and the
# observation extension the e2e cases read the browser through.
sonar.sources=src,scripts,extensions/cc
sonar.tests=test,harness,extensions/probe

# esbuild output, gitignored and rebuilt at test launch. Present in a checkout only if a
# build ran first; analysing a bundle of src/ reports every issue in src/ twice.
sonar.exclusions=extensions/cc/background.js,extensions/cc/choice.js,extensions/cc/options.js

sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info

# A file the lcov report never mentions is read as 0% covered, so anything outside the
# coverage run's scope has to be named here or it drags the project measure down while
# saying nothing true. `npm run test:coverage` measures `src/**` only, minus the three
# files no deterministic level can reach (vitest.coverage.config.ts says why).
sonar.coverage.exclusions=scripts/**,harness/**,extensions/**,src/extension/background.ts,src/extension/choice.ts,src/extension/options.ts
