# Configurable Containers — my routing config.
# Seeded from the shipped default (src/config/default.yaml), then merged with my
# own rules, which were generated from the MAC + Temporary Containers exports.
#
# Anything that matches no rule opens in a fresh temporary container, so the
# exemption block below is the only part that has to be right: it marks the hosts
# where isolating would BREAK something. Everything under "My rules" is routing.
#
# A bare host is shorthand for *://*.<host>/* and so covers its subdomains.
# A rule with only `match` opens in a container NAMED after the host; when `match`
# is a list, the FIRST host is used (e.g. [notion.com, notion.so] -> "notion.com").
# `open:` is only needed for a name that differs from that host. First match wins.
#
# Full reference: https://github.com/ArloL/configurable-containers/blob/main/CONFIG.md
#
# Saving applies the config straight away.

rules:

  # ---------------------------------------------------------------------------
  # Exemptions. First match wins, so these stay ABOVE my own rules: an SSO host
  # like accounts.spotify.com must win over the spotify.com rule further down, or
  # the login lands in the wrong container and fails.
  # ---------------------------------------------------------------------------

  # SSO / identity providers: stay in whichever container started the login.
  #
  # This is what makes "Sign in with …" work at all. Without it the auth hop counts
  # as a cross-site navigation and gets a FRESH throwaway, so the provider can't see
  # the session it just created. It does not widen exposure: if a site in a throwaway
  # sends you to accounts.google.com, the login page runs in THAT throwaway and still
  # can't reach the Google cookies in your other containers.
  #
  # A bare host also covers its subdomains, which is why one okta.com line is enough
  # to cover every customer's <tenant>.okta.com.
  - match:
    - accounts.google.com
    - accounts.spotify.com
    - appleid.apple.com
    - auth0.com
    - challenge.spotify.com
    - duosecurity.com
    - id.atlassian.com
    - id.bund.de
    - login.live.com
    - login.microsoftonline.com
    - login.salesforce.com
    - login.yahoo.com
    - okta-emea.com
    - okta.com
    - onelogin.com
    - pingone.com
    inherit: true

  # A card payment's "verify with your bank" step is the same situation: it must
  # stay in the container that started the checkout. These hosts are issuer-specific
  # — add one here whenever a payment bounces you to a blank page or an endless
  # verification loop.
  - match:
    - acs.3dsecure-atruvia.de
    - credorax.net
    - heidelpay.hpcgw.net
    - payment.unzer.com
    - secure.kps-payment.de
    - threeds.upcgw.com
    - threedssvc.pay1.de
    inherit: true

  # Link shims: transient hops that exist only to bounce you somewhere else. Not
  # isolated (so the hop doesn't burn a container), and the tab closes itself if it
  # strands you on the shim after redirecting (was TC closeRedirectorTabs).
  - match:
    - away.vk.com
    - href.li
    - l.facebook.com
    - l.instagram.com
    - l.messenger.com
    - lm.facebook.com
    - out.reddit.com
    - outgoing.prod.mozaws.net
    - slack-redir.net
    - t.co
    redirector: true

  # Left completely alone — no routing, no isolation, no side-effects; the tab is
  # left exactly as-is (was TC `ignoreRequests`). Firefox's own add-on and account
  # pages break in confusing ways when moved between containers.
  - match:
    - accounts.firefox.com
    - addons.mozilla.org
    - getpocket.com
    ignore: true

  # ---------------------------------------------------------------------------
  # My rules.
  # ---------------------------------------------------------------------------

  # Curated names: `open:` because the container name differs from the host.

  - match:
    - aws.amazon.com
    - signin.aws
    - awsapps.com
    open: AWS

  - match:
    - haeger-consulting.de
    - haeger-consulting.app.personio.com
    - haeger-consulting.atlassian.net
    - haegerconsulting.atlassian.net
    - haegerconsulting2006.sharepoint.com
    open: Haeger

  - match: "goflink.com"
    open: Flink

  # Two eligible containers, no `default:` — so this one asks every time.
  - match: outlook.cloud.microsoft
    open: [Haeger, HSP]

  # Auto-named: container name = the matched host (first host when `match` is a list).
  - match: "adventofcode.com"
  - match: "airbnb.de"
  - match: "bahn.de"
  - match: "bandcamp.com"
  - match: "beatport.com"
  - match: "booking.com"
  - match: "eatthismuch.com"
  - match: "feedly.com"
  - match: "followupthen.com"
  - match: "hetzner.com"
  - match: "immobilienscout24.de"
  - match: "kagi.com"
  - match: "kleinanzeigen.de"
  - match: "lieferando.de"
  - match: "linkedin.com"
  - match: "mail.google.com"
  - match: "mend.io"
  - match: "mural.co"
  - match: "overcast.fm"
  - match: "songkick.com"
  - match: "soundcloud.com"
  - match: "splitwise.com"
  - match: "spotify.com"
  - match: "taste.io"
  - match: "tensorx.ai"
  - match: "thestorygraph.com"
  - match: "tldraw.com"
  - match: "tmclub.eu"
  - match: "tradersplace.de"
  - match: "trello.com"
  - match: "typst.app"
  - match: "whatsapp.com"
  - match: "wohnsinn.com"
  - match: "wolt.com"
  - match: "zeldadungeon.net"

  # Multi-host, auto-named after the first host (order chosen so the first host
  # is the name we want; later hosts are additional matchers only).
  - match: [claude.ai, claude.com]            # -> "claude.ai"
  - match: [discord.com, discord.gg]          # -> "discord.com"
  - match: [github.com, github.dev]           # -> "github.com"
  - match: [gls.de, gls-online-filiale.de]    # -> "gls.de"
  - match: [notion.com, notion.so]            # -> "notion.com"
  - match: [openai.com, chatgpt.com]          # -> "openai.com"
  - match: [paypal.com, py.pl]                # -> "paypal.com"
  - match: [wikipedia.org, wikimedia.org]     # -> "wikipedia.org"
  - match: [yahoo.com, yahooinc.com]          # -> "yahoo.com"

  # Disposable + overlays: `open: Temporary` (reuse the current throwaway only within
  # the same site/group, else isolate) plus per-domain cookie seeds / content scripts
  # in one entry. Was TC `cookies` + `scripts` on otherwise-unmanaged domains.
  - match: youtube.com
    open: Temporary
    cookies:
      - { name: wide, url: "https://www.youtube.com/", value: "1" }
      - { name: SOCS, url: "https://www.youtube.com/", value: "CAESEwgDEgk4MzE1NjQ2OTUaAmVuIAEaBgiAv9TIBg", secure: true, sameSite: lax }
    scripts:
      - at: document_start
        run: "localStorage.setItem('yt-player-sticky-caption', JSON.stringify({data:'false',expiration:Date.now()+2592000000,creation:Date.now()}));"
      # Always play a video's ORIGINAL audio, never a machine dub. YouTube picks the
      # default track server-side from `hl`, which also sets the interface language --
      # so there is no cookie that gets original audio and a German UI, and signed out
      # nothing persists. It has to be corrected on every page.
      #
      # This holds an INVARIANT rather than acting once, because the player applies a
      # switch and then reverts it seconds later when playback commits (measured: set
      # at t=874, applied by t=1055, back on the dub by t=5750). That also makes SPA
      # navigation, back-navigation onto an already-fixed video, and the revert all the
      # same case, with no bookkeeping to get wrong.
      #
      # Full reversing notes: docs/superpowers/specs/2026-07-31-youtube-original-audio-design.md
      - at: document_start
        run: |
          (() => {
            // The flags live under a MINIFIED key that changes with every player
            // build, so find them by shape. The plain names (isAutoDubbed,
            // audioIsDefault) hold only in the response JSON, which the player ignores.
            const flags = (t) => {
              if (!t) return null;
              for (const k of Object.keys(t)) {
                const v = t[k];
                if (v && typeof v === "object" && "isAutoDubbed" in v) return v;
              }
              return null;
            };
            // This fails silently by design -- every giving-up path is a bare return,
            // and the only symptom is a video playing German. So each one says WHY on
            // documentElement, which the page console can read even though the content
            // script's own scope cannot be inspected: `document.documentElement.dataset.ccAudio`.
            let mark = "";
            const state = (s) => {
              if (s === mark) return;
              mark = s;
              try { document.documentElement.dataset.ccAudio = s; } catch (e) {}
            };
            state("armed");

            const enforce = () => {
              // A content script is an isolated world: the player's methods are only
              // reachable through wrappedJSObject. Without it this silently never fires.
              const el = document.getElementById("movie_player");
              const p = el && el.wrappedJSObject;
              if (!p || typeof p.getAvailableAudioTracks !== "function") return state("no-player");
              const tracks = Array.from(p.getAvailableAudioTracks() || []);
              if (!tracks.length) return state("no-alternate-tracks");
              // Guard on the track the SERVER marked default, not the current one:
              // getAudioTrack() reports "und" until playback commits, so a
              // current-track guard never sees the dub and never fires. A video whose
              // default is not a dub is left alone -- its extra tracks are deliberate.
              const def = tracks.find((t) => { const f = flags(t); return f && f.isDefault; });
              if (!def) return state("no-default-marked");
              if (!flags(def).isAutoDubbed) return state("default-not-a-dub:" + flags(def).id);
              const orig = tracks.find((t) => { const f = flags(t); return f && !f.isAutoDubbed; });
              if (!orig) return state("no-original-available");
              const cur = flags(p.getAudioTrack());
              if (cur && cur.id === flags(orig).id) return state("holding:" + cur.id);
              p.setAudioTrack(orig);
              state("switched:" + flags(orig).id);
            };
            // Polling, because NOTHING announces the change: the player reverts the
            // track silently. Verified by patching EventTarget.prototype.dispatchEvent
            // and recording all 48 event types the page fires -- not one landed in the
            // 700ms before a revert. video.audioTracks is no help either: it sits behind
            // media.track.enabled (off by default) and reads length 0, since YouTube
            // feeds audio through MSE.
            //
            // So the poll is bounded instead of dropped: a window re-armed on every
            // media load, rather than a timer running for the life of the tab.
            // loadstart fires on first load, on SPA navigation, on back-navigation onto
            // an already-fixed video, and at each ad break -- every moment the track can
            // change -- and this idles at zero cost in between.
            //
            // 60s because reverts were measured at 5.7s and at 17.1s after the switch.
            // Whatever schedules them is not something we can see, so the window is set
            // by margin over the worst observed, not by a known bound.
            let until = 0;
            let timer = null;
            const arm = () => {
              until = Date.now() + 60000;
              if (timer) return;
              timer = setInterval(() => {
                try {
                  enforce();
                } catch (e) {
                  // Never throw into the page.
                }
                if (Date.now() > until) {
                  clearInterval(timer);
                  timer = null;
                  state(mark.indexOf("holding") === 0 ? mark : "idle:" + mark);
                }
              }, 100);
            };
            document.addEventListener("loadstart", (e) => {
              if (e.target instanceof HTMLMediaElement) arm();
            }, true);
            arm(); // the first load may already be under way
          })();
  - match: woki.de
    open: Temporary
    cookies:
      - { name: klaro, url: "https://www.woki.de/", value: '%7B%22cpConfig%22%3Atrue%2C%22basicCookie%22%3Atrue%2C%22cpIt%22%3Atrue%2C%22scrollContent%22%3Atrue%2C%22klaro%22%3Atrue%2C%22youtube%22%3Afalse%2C%22googleMaps%22%3Afalse%2C%22googleRecaptcha%22%3Afalse%2C%22googleAnalytics%22%3Afalse%7D' }
  - match: kraftfuttermischwerk.de
    open: Temporary
    scripts:
      - at: document_start
        run: "localStorage.setItem('jetpack_post_subscribe_modal_dismissed', Date.now().toString());"

# Isolation-continuity groups: sites in one group stay in the SAME throwaway as you
# move between them, while crossing to anything outside it spins up a clean one.
# Each group is a plain list of matchers — no "match:" key here, unlike a rule — in
# the same grammar rules use (hostname, "scheme://host/path" pattern, { regex: … }).
# Order-significant, first-match wins; a URL resolves to at most one group. Groups
# never route and never override a rule.
groups:
  # Google is ~190 registrable domains, one per ccTLD, and a redirect between two of
  # them (google.com -> google.de) is a cross-site navigation that would otherwise cost
  # the throwaway you were signed into. No match pattern can say this — a host wildcard
  # is only a leading "*." — so it is the regex form or 190 lines. Single-quoted so the
  # backslashes are the regex's own and not YAML escapes.
  #
  # It is deliberately loose at the tail: `google.zz` is inside the group whether or not
  # Google owns it. The cost of that is a stranger's site sharing a THROWAWAY with a
  # Google session that is itself disposable, which is a non-event; the cost of being
  # strict is enumerating every ccTLD and re-checking the list forever.
  - [
      { regex: '^https?://([^/]+\.)?google\.[a-z]{2,3}(\.[a-z]{2})?/' },
      youtube.com, youtu.be,
    ]
  - [oracle.com, oraclecloud.com, identity.oraclecloud.com]
  - [check24.de, check24.com]
  - [conrad.de, conrad.com]
  - [microsoft.com, office.com, cloud.microsoft, sharepoint.com, microsoftonline.com]
  - [atlassian.net, atlassian.com, trello.com]
