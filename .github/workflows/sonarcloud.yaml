name: SonarCloud

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    # SONAR_TOKEN is an ENVIRONMENT secret, not a repo one, so a job that omits this
    # resolves it to the empty string and fails inside the scanner on authentication
    # rather than on anything naming the cause.
    environment: sonarcloud
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Sonar reads git blame to attribute issues to authors and to decide what is New
        # Code; a shallow clone leaves every line looking new on the first analysis after
        # a merge. persist-credentials stays false with it — a full history plus a token
        # left in .git/config is zizmor's `artipacked`, and the scanner needs no push
        # access of its own.
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm

    - run: npm ci

    # L1-L3 only, seconds, no browser. The scan step imports the lcov this writes; without
    # this step the analysis still succeeds and reports the project at 0% covered.
    - run: npm run test:coverage

    - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # The action targets SonarQube Server by default. Cloud needs the host named
        # explicitly; omit it and the scan fails resolving a server that is not there.
        SONAR_HOST_URL: https://sonarcloud.io

  required-status-check:
    name: sonarcloud.required-status-check
    needs:
    - analyze
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq --exit-status 'all(.result == "success")' || exit 1
