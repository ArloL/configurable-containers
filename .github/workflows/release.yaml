name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # calver-tag-action pushes a tag; gh release creates a release
    steps:
      # calver-tag-action pushes the tag with these credentials, so unlike ci.yml
      # they must be kept.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
        with:
          firefox-version: latest

      - run: npm ci

      - run: npm run typecheck

      # A release that has not passed e2e is not a release.
      - name: Run tests (headless Firefox via Selenium)
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: npm test

      - uses: ArloL/calver-tag-action@0e91bea86df7d9b445b6dbde498d30c273032ea0 # v2607.0.105
        id: version

      - name: Package the xpi at the tagged version
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: npm run package -- "$VERSION"

      # addons-linter is what AMO runs server-side; failing here beats failing after
      # a version number has been burned, since AMO never forgets one.
      - name: Lint the packaged extension
        run: npx web-ext lint --source-dir dist/cc

      # AMO requires reviewable source whenever the shipped JS is bundled, and
      # background.js is an esbuild bundle.
      - name: Build the source archive
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git archive --format=zip --output "dist/configurable-containers-src-${VERSION}.zip" HEAD

      # Attaching the archive to the GitHub release satisfies nothing on AMO's side;
      # --upload-source-code is what does.
      - name: Submit to AMO (listed channel)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          npm run submit -- \
            --upload-source-code "dist/configurable-containers-src-${VERSION}.zip"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "dist/configurable-containers-${VERSION}.xpi" \
            "dist/configurable-containers-src-${VERSION}.zip"
