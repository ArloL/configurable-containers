name: Publish dev update manifest

on:
  workflow_call:
    inputs:
      tag:
        # The release the caller just published. The manifest is not deployed without it:
        # the API can list a fresh release with no assets, and dev-updates.js skips those.
        description: The dev release this manifest must offer, e.g. v2609.0.146
        required: false
        type: string
  workflow_dispatch:
  release:
    types:
    - published

permissions: {}

jobs:
  build-manifest:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build updates.json from the dev releases
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECT_TAG: ${{ inputs.tag }}
      run: node scripts/dev-updates.js
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    needs: build-manifest
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
