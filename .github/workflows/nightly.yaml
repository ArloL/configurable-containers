name: Nightly

# Guard rails, not gates: these run on a schedule and open an issue on regression
# rather than blocking a PR. They are the cases that cost too much wall clock to sit
# in `npm test` on every push. See TESTING.md, "Cross-cutting gates".

on:
  schedule:
  - cron: "43 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency: nightly

jobs:
  disposal-realtime:
    name: Real-delay disposal
    runs-on: ubuntu-latest
    # The case itself waits out a five-minute grace plus slack; the rest is Firefox
    # startup and npm. Generous, so a slow runner reports a failure rather than a kill.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - # No mac necessary: this runs one CC-only case. mac/ is needed by
      # test/e2e/mac-interop.test.ts, which ci.yaml already covers on every push.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: npm
        node-version-file: .tool-versions
    - id: firefox
      # Same reason as ci.yaml: the runner's default Firefox is a snap, which
      # geckodriver/Selenium cannot drive reliably.
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      with:
        firefox-version: latest
    - run: npm ci
    - # A real five-minute timer in a real background page — the one thing the fake
      # clock at L3 and the 500ms grace at L4 structurally cannot prove.
      name: Run the real-delay cases (headless Firefox via Selenium)
      env:
        FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
      run: npm run test:realtime

  mutation:
    name: Mutation gate (the pure modules)
    runs-on: ubuntu-latest
    # Five pure modules, ~1160 mutants, no browser: about two minutes of work plus npm.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - # No Firefox and no mac here — the suite Stryker runs is the pure levels only, on
      # purpose (vitest.mutation.config.ts says why).
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: npm
        node-version-file: .tool-versions
    - run: npm ci
    - # Fails under 100%. The log names every surviving mutant and the tests that ran
      # against it, which is what the follow-up work needs.
      name: Mutate the resolver, the matcher, the same-site check, the config parser and the overlays
      run: npm run test:mutation
    - # Stryker writes this on every run and, until now, the runner was torn down with it
      # still inside: a browsable per-mutant report — the mutated source, what each survivor
      # changed, which tests ran — that nobody could ever open. The clear-text table in the
      # log is a score; this is the thing you need the moment a mutant survives.
      #
      # `always()`, because the run that fails is exactly the run worth reading, and a
      # failing step would otherwise skip its own evidence.
      name: Keep the mutation report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mutation-report
        path: reports/mutation/
        retention-days: 14

  flake:
    name: e2e determinism (sample ${{ matrix.sample }})
    # Two SAMPLES, ten runs each. Not shards — each leg runs the whole tier and reaches its
    # own verdict; what differs is the machine.
    #
    # Ten because the marginal cost of a run is only the suite (~2min: checkout, npm ci and
    # Firefox are amortised across the whole job), and because three is thin. P(catching a
    # race that fails 1 run in 3) is 67% at N=3 and 98% at N=10; 1-in-10 goes 27% to 65%.
    # The race that took auto-temp's startup sweep down had been there since f9ab866 and
    # had a one-in-three chance of slipping through the run that finally caught it.
    #
    # Two legs because runs INSIDE one job are correlated: same runner, same machine, same
    # noisy neighbours. A race whose odds depend on how fast the box is can sit at ~0 there
    # however many times it repeats, and separate hardware is the only thing that varies
    # it. Ten each on two boxes beats twenty on one, at the same wall clock.
    #
    # More runs cannot make this job noisier, which is what makes the trade one-sided: it
    # fails on DISAGREEMENT, and a disagreement is a real race by construction.
    strategy:
      # Both legs always run. A leg that finds a race must not deny the other the chance
      # to say whether it saw the same one — that comparison is half the diagnosis.
      fail-fast: false
      matrix:
        sample:
        - 1
        - 2
    runs-on: ubuntu-latest
    # Twenty-odd minutes of testing. Generous, because a run killed at the cap looks
    # exactly like the thing this job exists to report.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - # test/e2e/mac-interop.test.ts FAILS rather than skips without it, and a case that
      # fails every run would be reported here as red rather than as flaky — true, but not
      # what anyone wants this job to say.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: mac
        persist-credentials: false
        repository: mozilla/multi-account-containers
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: npm
        node-version-file: .tool-versions
    - id: firefox
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      with:
        firefox-version: latest
    - run: npm ci
    - # Fails on DISAGREEMENT between the runs — a case that fails every time is the suite
      # being red, which ci.yaml already reports — and on a run that failed as a WHOLE with
      # no case to show for it, which is what a dead `beforeAll` looks like and what this
      # job used to call "all consistent". `npm test` deliberately has no --retry to paper
      # over either.
      #
      # Each run gets its own FILE ORDER (vitest.config.ts shuffles; the script picks the
      # seeds so the report can name them). That is what lets this see an order dependence
      # at all: in a fixed order such a case fails identically every run, which reads as red
      # rather than as a race, and the comparison never gets to say anything about it.
      name: Run the browser tier ten times and compare
      env:
        FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        FLAKE_RUNS: '10'
      run: npm run test:flake

  firefox-nightly:
    name: Firefox Nightly tripwire
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: mac
        persist-credentials: false
        repository: mozilla/multi-account-containers
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        cache: npm
        node-version-file: .tool-versions
    - id: firefox
      # The early warning ci.yaml's latest/latest-esr matrix cannot give: what Firefox is
      # about to do, rather than what it does. A break here is months of notice on a
      # webRequest or containers change; a break on `latest` is a break for users today.
      uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      with:
        firefox-version: latest-nightly
    - env:
        FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
      run: '"$FIREFOX_BIN" --version'
    - run: npm ci
    - name: Run tests against Firefox Nightly
      env:
        FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
      run: npm test

  reproducible-build:
    name: Reproducible release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - # Uncached for the same reason verify-release.yaml is: a verifier must not install
      # from a mutable cache an earlier run could have poisoned, or a tampered build gets
      # certified reproducible. `package-manager-cache` defaults to TRUE, so dropping
      # `cache: npm` is not enough — setup-node would resume caching the day package.json
      # declares `packageManager`. zizmor only flags the pairing on a release trigger, so
      # nothing would have reported it here.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .tool-versions
        package-manager-cache: false
    - run: npm ci
    - # Every release body says "Reproduce this build:" and gives two commands. This runs
      # them: it rebuilds the last LISTED release from its own published source archive
      # with its own published BUILD_TIMESTAMP, and compares the sha256 with the xpi
      # attached beside it. Nothing else ever checks that promise — AMO repacks uploads,
      # so its copy is not byte-comparable, and the GitHub asset is the only one that is.
      #
      # NOT made redundant by verify-release.yaml, which checks each release once as it is
      # published. This asks the other question: whether a release that reproduced when it
      # was cut STILL reproduces on today'"'"'s toolchain — a newer Node, a dependency yanked
      # from the registry, a source archive that stopped installing. Delete it and that
      # decay goes unnoticed.
      name: Rebuild the last listed release and compare hashes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run verify:reproducible

  report-regression:
    name: Report a regression
    needs:
    - disposal-realtime
    - mutation
    - flake
    - reproducible-build
    - firefox-nightly
    # Nobody watches a scheduled run, so a red night has to come and find us. Only on
    # failure — a cancelled or skipped run is not a regression.
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Open or update the tracking issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DISPOSAL_RESULT: ${{ needs.disposal-realtime.result }}
        MUTATION_RESULT: ${{ needs.mutation.result }}
        FLAKE_RESULT: ${{ needs.flake.result }}
        REPRO_RESULT: ${{ needs.reproducible-build.result }}
        NIGHTLY_FF_RESULT: ${{ needs.firefox-nightly.result }}
      run: |
        set -euo pipefail
        # One issue per failing guard rail — they fail for unrelated reasons and are
        # fixed by different work — and one issue for the whole streak: a nightly that
        # fails for a week should not file seven of them.
        report() {
          export TITLE="$1" # exported: the jq filter below reads it from the environment
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'first(.[] | select(.title == env.TITLE) | .number) // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$2"
          fi
        }

        if [ "$DISPOSAL_RESULT" = failure ]; then
          report "Nightly real-delay disposal is failing" "$(cat <<EOF
        \`npm run test:realtime\` failed: $RUN_URL

        That case waits out the shipped five-minute grace in a real Firefox, so a
        failure means one of two things, and the assertion that failed says which:

        - **removed early** — the bundle is not carrying the production grace, or
          something disposes a throwaway without waiting for it.
        - **never removed** — a long background-page timer was throttled, coalesced or
          dropped. Every other disposal test uses a fake clock or a 500ms grace and
          would stay green through it (TESTING.md, F10).
        EOF
        )"
        fi

        if [ "$NIGHTLY_FF_RESULT" = failure ]; then
          report "Firefox Nightly tripwire is failing" "$(cat <<EOF
        \`npm test\` failed against Firefox Nightly: $RUN_URL

        This is the early warning, not a break for users: ci.yaml runs the same suite
        against \`latest\` and \`latest-esr\` on every push, and both were green when this
        was written. What it means is that something Firefox is ABOUT to ship changes an
        answer CC depends on.

        The facts most likely to move are the measured ones, and CLAUDE.md names them:
        webNavigation.onBeforeNavigate firing before that navigation's webRequest (the F13
        view-source guard), tabs.create refusing about:newtab, tabs.create honouring
        windowId for popup windows, and onCreated firing with about:blank before the real
        url (bug 1586612).

        A failure here is worth a bug filed upstream while there is still time, which is
        the whole reason for running it.
        EOF
        )"
        fi

        if [ "$REPRO_RESULT" = failure ]; then
          report "Nightly reproducible-build check is failing" "$(cat <<EOF
        \`npm run verify:reproducible\` failed: $RUN_URL

        The xpi rebuilt from a release's own source archive no longer matches the one
        published beside it, or the release cannot be rebuilt at all. The log says which.

        - **different sha256** — something in the build stopped being a function of its
          inputs. The usual suspects are a dependency that is not pinned by the lockfile,
          a timestamp read from the clock rather than from BUILD_TIMESTAMP, and entries
          going into the zip in filesystem order (scripts/package.ts sorts them and fixes
          the mtime at 1980 for exactly this reason).
        - **no BUILD_TIMESTAMP / no source archive** — the release went out without what
          its own notes tell a reader to use. That is a release.yaml problem, not a build
          one.

        Note this can only ever be checked against the GitHub asset. AMO REPACKS uploads,
        so its copy is never byte-comparable with a local rebuild.
        EOF
        )"
        fi

        if [ "$FLAKE_RESULT" = failure ]; then
          report "Nightly e2e determinism is failing" "$(cat <<EOF
        \`npm run test:flake\` failed: $RUN_URL

        The browser tier was run ten times on this runner and did not give the same answer
        every time. The other sample leg ran ten more on a different box; read its result
        beside this one, because whether it saw the same disagreement is half the diagnosis.
        The log names each case with its run-by-run story. Two shapes, and the story says
        which:

        - **passed → failed → passed** — a race in the case, in time or in ORDER. The
          report prints the seed each answer came from and a \`--sequence.seed=\` command
          that replays the failing one; run that first, because an order that reproduces
          turns this from a race into an ordinary bug. The time-dependent ones this harness
          has already had are in TESTING.md's e2e section: a probe reply landing after the
          navigation that destroyed the document it was written into, an assertion made
          before \`reportTab\` finished its two cookie reads, a window handle closing
          between the listing and the switch. The fix is the case.
        - **passed → never ran** — the file did not get as far as that case, so something
          threw on import or the run died. Look at the run's own output, not at the case.
        - **every run failed as a whole, no case saying why** — nothing ran at all. That is
          a dead \`beforeAll\`, which records the cases it owns as "skipped": no Firefox, no
          geckodriver, no harness server, no \`mac/\` checkout. Read the first run's output.

        Not a way it goes green: \`--retry\`. It turns a race into a pass and throws away
        the evidence that there was one (TESTING.md, "Cross-cutting gates").
        EOF
        )"
        fi

        if [ "$MUTATION_RESULT" = failure ]; then
          report "Nightly mutation gate is failing" "$(cat <<EOF
        \`npm run test:mutation\` failed: $RUN_URL

        A survivor is a change to one of the five pure modules — the resolver, the matcher,
        the same-site check, the config parser, the overlays — that no test owning that
        module notices. The log lists each one with the tests that ran against it. Two ways
        it goes green again, and the mutant says which is honest:

        - **a behaviour nothing asserts** — write the case at L1/L2. That is the whole
          point of the gate; a case at L3 would leave the level that owns the logic
          still unable to tell.
        - **an equivalent mutant** — the change cannot alter an answer. Then it needs a
          \`// Stryker disable\` comment saying *why*, next to the code (TESTING.md,
          "Cross-cutting gates").

        Not a way it goes green: lowering \`thresholds.break\`.
        EOF
        )"
        fi
