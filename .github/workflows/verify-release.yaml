name: Verify a published release

# The gate that has no subject to look for. `nightly.yaml`'s reproducible-build job had to
# go hunting for the release to check, its search silently came back empty, and it passed
# in zero seconds every night for four weeks. Here the release is NAMED to this workflow —
# by the job that just published it, or by the event, or by hand — so it never searches,
# and that entire class of failure cannot occur.
#
# It runs on BOTH channels, with no branching in the workflow: since 2026-08-25 a dev
# prerelease publishes the same artefacts a listed release does — the reproducible
# pre-signing xpi, the source archive it was built from, and BUILD_TIMESTAMP in its notes
# — so "verify a release" means one thing. The only difference left is the `--dev` the
# rebuild needs, and `planFor` decides that from the release itself.
#
# This does NOT replace the nightly job, which answers a different question: whether a
# release that reproduced when it was cut still reproduces on today's toolchain.

on:
  # How it actually fires for our releases. A release created with the default
  # GITHUB_TOKEN — which is every release this repo publishes — triggers NO workflow:
  # GitHub suppresses those events to stop workflows recursing. So `on: release` alone
  # would make this gate dead on arrival, the very failure it exists to prevent.
  # `publish-dev-manifest.yaml` hit the same wall and is called the same way; its
  # `on: release` has fired exactly zero times in ~150 releases.
  workflow_call:
    inputs:
      tag:
        description: The release tag to verify, e.g. v2608.0.112
        required: true
        type: string
  # For a release a PERSON creates in the GitHub UI, which does trigger.
  release:
    types: [published]
  # And for checking a release published before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to verify, e.g. v2608.0.112
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Rebuild the release and compare hashes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read # reads the provenance the publishing job stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caching is disabled EXPLICITLY, and omitting `cache:` is not enough to do it:
      # setup-node's `package-manager-cache` input defaults to **true**, so it caches on
      # its own as soon as package.json declares `packageManager` or
      # `devEngines.packageManager`. This repo declares neither today, which means an
      # unrelated edit to package.json would silently start caching here.
      #
      # It must not. A job that decides whether a published artefact is trustworthy cannot
      # take its own dependencies from a mutable cache an earlier run could have poisoned
      # — that is how a tampered build gets certified reproducible. zizmor's
      # cache-poisoning audit flags the release trigger paired with a caching action, and
      # the fix is this input rather than an ignore: a suppression would go on lying the
      # day package.json gains that field.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      # The half the hash comparison below cannot reach. Rebuilding the xpi from its own
      # published source archive proves the two agree WITH EACH OTHER — a release built by
      # hand, from a tree that never existed in git, reproduces against itself perfectly and
      # passes every other check this repo runs. The provenance names the commit, so this is
      # what makes the source archive checkable against a public one.
      #
      # `gh attestation verify` already enforces that the artefact was built by a workflow in
      # THIS repository; the digest comparison is the extra step, and it is the one the gate
      # exists for: without it a genuine build of some other commit — an older release's
      # artefact renamed, a branch nobody reviewed — verifies clean.
      #
      # The commit comes from the tag through the commits endpoint rather than the ref one,
      # because that resolves an annotated tag's object to the commit it points at, and
      # calver-tag-action's tags are not guaranteed to be lightweight.
      #
      # Two artefacts, named exactly, for the same reason the attest step names them: a dev
      # release also carries the AMO-SIGNED xpi, which is a repack of the pre-signing build
      # and has no attestation of its own.
      #
      # An empty digest is a FAILURE and not a pass. `gh`'s json shape is not this repo's to
      # promise, and a `--jq` path that has moved answers nothing at all — which, compared
      # with `$commit`, has to be a mismatch rather than a match against nothing.
      #
      # A release cut before this step existed carries no attestation and fails here. That is
      # the honest answer for a hand-dispatched re-check of one, and it is why provenance is
      # wired into the two publishing paths rather than run over history.
      #
      # The tag is checked for shape first, for the reason verify-reproducible.ts's
      # `releaseTag` gives: it goes into an API path, and one carrying "../" or "?" addresses
      # a different release from the one this job believes it is verifying.
      - name: Verify the release's build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::not a release tag: $TAG (expected v<YYMM>.<day>.<micro>)"
            exit 1
          }
          version="${TAG#v}"
          dir="$(mktemp -d)"
          gh release download "$TAG" --repo "$REPO" --dir "$dir" \
            --pattern "configurable-containers-${version}.xpi" \
            --pattern "configurable-containers-src-${version}.zip"
          commit="$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)"
          echo "$TAG is commit $commit"
          for file in "$dir"/*; do
            built_from="$(gh attestation verify "$file" --repo "$REPO" --format json \
              --jq '.[].verificationResult.signature.certificate.sourceRepositoryDigest' \
              | sort -u)"
            if [ "$built_from" != "$commit" ]; then
              echo "::error::$(basename "$file") attests a build of '${built_from}', not ${commit}"
              exit 1
            fi
            echo "$(basename "$file"): built from $built_from"
          done

      # Downloads the release's own xpi and source archive, rebuilds from the archive with
      # the release's own published BUILD_TIMESTAMP, and compares the sha256. A mismatch
      # means the notes promise a reproduction that does not hold.
      - name: Rebuild the published release and compare hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: npm run verify:reproducible -- "$TAG"
