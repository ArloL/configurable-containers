name: CI

on:
  # push is limited to main: an unfiltered one would run this workflow twice for
  # the same commit, once for the branch push and once for the pull request. On
  # main there is no pull request run to double up with, and the merge commit is
  # a commit no pull request ever tested.
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # test/e2e/mac-interop.test.ts loads the real Multi-Account Containers from
          # the mac/ submodule. NOT recursive: mac's own nested _locales submodule is a
          # whole localisation repo, and the harness synthesises the few keys instead.
          submodules: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # The runner's default Firefox is a snap, which geckodriver/Selenium cannot
      # drive reliably. Install a real Firefox tarball instead.
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
        with:
          firefox-version: latest

      - env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: '"$FIREFOX_BIN" --version'

      - run: npm ci

      - run: npm run typecheck

      # addons-linter is what AMO runs server-side; catching it here means a manifest
      # problem surfaces on the PR rather than at release time.
      - run: npm run lint:ext

      # Selenium Manager auto-provisions geckodriver at runtime (network needed).
      # FIREFOX_BIN points the harness at the Firefox installed above.
      - name: Run tests (headless Firefox via Selenium)
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: npm test

  publish-dev:
    name: Publish unlisted dev build
    # Push-to-main only: signing a pull request's head commit would spend an AMO
    # version on a commit that may never land.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag, creates the release
    steps:
      # calver-tag-action pushes a tag with these credentials and scans the existing
      # v<YYMM>.* tags for a free micro, so unlike the test job both are needed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unlike release.yaml the tag cannot come after the steps that can fail: the
      # version is signed into the manifest, so it has to exist first. A signing failure
      # leaves a tag with no release against it, which a dev build can afford.
      - uses: ArloL/calver-tag-action@0e91bea86df7d9b445b6dbde498d30c273032ea0 # v2607.0.105
        id: version

      - name: Build and sign the unlisted dev build
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: npm run sign:dev -- "$VERSION"

      # The asset goes in the create call because immutable releases are enabled here: a
      # published release cannot be added to afterwards. --prerelease is what tells a dev
      # build from a listed one, since both draw from the same calver tag sequence, and
      # is what scripts/dev-updates.ts filters on.
      - name: Publish the immutable dev release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          xpi="dist/dev/signed/$(jq --raw-output .xpi dist/dev/signed/build.json)"
          gh release create "v${VERSION}" "$xpi" \
            --prerelease \
            --title "dev v${VERSION}" \
            --notes "Unlisted dev build of ${GITHUB_SHA}. Installs and updates itself via the dev channel; see README, 'Running an unreleased build'."

  publish-dev-updates:
    name: Publish the dev update manifest
    # Rebuilt from the releases API every time, so withdrawing a bad dev build is
    # deleting its release and re-running this.
    needs: publish-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages permits one deployment at a time, and a superseded run is rebuilt from
    # scratch by the next one.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build updates.json from the dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --slurp makes --paginate emit one json document instead of one array per
          # page; flatten(1) is a no-op when there was only ever one page.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp \
            | jq 'flatten(1)' \
            | npx tsx scripts/dev-updates.ts site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy

  required-status-check:
    name: ci.required-status-check
    # publish-dev is deliberately absent: it skips on every pull request, and a skip
    # is not a success to the check below.
    needs:
    - test
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq --exit-status 'all(.result == "success")' || exit 1
